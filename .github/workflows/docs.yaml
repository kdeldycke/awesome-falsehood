---
name: 📚 Docs
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - changelog.md
      - citation.cff
      - "docs/**"
      - pyproject.toml
      - "readme.*.md"
      - readme.md
      - uv.lock
      - "**/*.py"
  schedule:
    - cron: "43 6 15 * *"

jobs:

  docs:
    uses: kdeldycke/repomatic/.github/workflows/docs.yaml@504998fb9b230dfd2405d6dc352366e2d08923ad # v7.17.1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
